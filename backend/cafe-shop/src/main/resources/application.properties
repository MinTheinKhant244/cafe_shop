spring.application.name=cafe-shop

server.address=0.0.0.0

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/cafeshop?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Connection pool (HikariCP)
spring.datasource.hikari.maximumPoolSize=10
spring.datasource.hikari.minimumIdle=5

# application.properties
logging.level.com.hmi.cafe_shop=DEBUG
logging.level.com.hmi.cafe_shop.serviceImpl=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %level - %msg%n
